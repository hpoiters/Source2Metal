name: Verify and publish Source2Metal v3.4.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/Source2Metal_core/**'
      - 'source/Source2Metal_console/**'
      - 'tools/build_release.sh'
      - 'tools/release.py'
      - 'validation/release_hashes.json'
      - '*.md'
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: source2metal-341-release
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Test, vet, self-test and build final v3.4.1
        run: bash tools/build_release.sh
      - name: Verify source, embedded core, seven languages and package
        run: python3 tools/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: Source2Metal-v3.4.1-verified
          path: release_v3.4.1/*
      - name: Publish verified assets and then mark Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish
