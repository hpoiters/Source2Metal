name: Test GAME-METAL final progress patch
on:
  push:
    branches:
      - fix/v3.4.2-metal-final-progress
    paths:
      - '.github/workflows/test-metal-final-progress.yml'
      - 'source/Source2Metal_core/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Format patched Go file
        run: gofmt -w source/Source2Metal_core/game_metal.go source/Source2Metal_core/main.go source/Source2Metal_core/ctg_integration.go
      - name: Acquire Syzygy package and test/build
        run: bash tools/build_release.sh
      - name: Verify single EXE contains updated core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          core = Path('dist/Source2Metal_core.exe').read_bytes()
          launcher = Path('dist/!Source2Metal_v3.4.1.exe').read_bytes()
          assert core in launcher, 'Updated core not embedded in launcher'
          print('Embedded-core check: OK')
          PY
      - name: Archive isolated test executable
        uses: actions/upload-artifact@v4
        with:
          name: Source2Metal-one-EXE-progress-test-Windows-x64
          path: |
            dist/!Source2Metal_v3.4.1.exe

  defender-check:
    needs: windows-test
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Source2Metal-one-EXE-progress-test-Windows-x64
          path: testbin
      - name: Check whether Microsoft Defender scanning is available
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path testbin -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Missing test EXE' }
          Write-Output ('SHA256: ' + (Get-FileHash $exe.FullName -Algorithm SHA256).Hash)
          $cmd = Get-Command Start-MpScan -ErrorAction SilentlyContinue
          if (-not $cmd) { throw 'Defender scanner unavailable: no security verdict' }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            throw 'Defender antivirus not active: no security verdict'
          }
          Start-MpScan -ScanType CustomScan -ScanPath $exe.FullName -ErrorAction Stop
          $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.Resources -match [regex]::Escape($exe.Name) })
          if ($hits.Count -gt 0) { $hits | Format-List; throw 'Defender detection: do not use build' }
          Write-Output 'Defender custom scan completed without a reported matching detection.'
