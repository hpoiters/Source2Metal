name: Build and release Source2Metal v3.0.10

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - validate-v3.0.10
    paths:
      - 'source/Source2Metal_v3.0.10/**'
      - 'source/SyzygyCheck_v2.2.0/**'
      - 'README.md'
      - 'BUILDING.md'
      - 'LICENSE'
      - 'PRIVACY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CODE_SIGNING_POLICY.md'
      - '.github/workflows/build-release-v3.0.10.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.24.6
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false

      - name: Fetch pinned published SyzygyCheck v2.2.0 utility
        shell: pwsh
        working-directory: source/Source2Metal_v3.0.10
        run: ./prepare_syzygy_package.ps1

      - name: Test Source2Metal
        working-directory: source/Source2Metal_v3.0.10
        run: |
          go test ./...
          go vet ./...

      - name: Test SyzygyCheck
        working-directory: source/SyzygyCheck_v2.2.0
        run: |
          go test ./...
          go vet ./...

      - name: Check clean current source and documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $obsoletePaths = @(
            'build_inputs',
            'source/Source2Metal_v3.0.7',
            'source/SyzygyCheck_v2.0.7',
            'source/Source2Metal_v3.0.10/DEVELOPMENT_HISTORY',
            'source/Source2Metal_v3.0.10/legacy_sources',
            'source/Source2Metal_v3.0.10/assets',
            'source/Source2Metal_v3.0.10/embedded_source.go',
            'source/Source2Metal_v3.0.10/embedded_syzygy_source.go',
            'source/Source2Metal_v3.0.10/syzygycheck_source.zip'
          )
          foreach ($path in $obsoletePaths) {
            if (Test-Path $path) { throw "Obsolete path remains: $path" }
          }

          $sourceVersions = Get-ChildItem 'source' -Directory | Select-Object -ExpandProperty Name
          $expectedSourceVersions = @('Source2Metal_v3.0.10', 'SyzygyCheck_v2.2.0')
          if ((Compare-Object $sourceVersions $expectedSourceVersions)) {
            throw "Source tree must contain only the two current version directories"
          }
          $archives = Get-ChildItem . -Recurse -File -Include '*.zip', '*.7z', '*.tar', '*.gz' |
            Where-Object { $_.FullName -notlike '*\.git\*' }
          if ($archives.Count -ne 1 -or $archives[0].FullName -ne
              (Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.10/syzygycheck_package.zip')) {
            throw "The current source tree may contain only the one nested SyzygyCheck utility archive"
          }
          if (Get-ChildItem . -Recurse -File -Filter '*.exe' |
              Where-Object { $_.FullName -notlike '*\.git\*' }) {
            throw "Compiled executables do not belong in the source tree"
          }

          $s2m = 'source/Source2Metal_v3.0.10'
          $readmeName = 'Readme-README-Прочтите-自述文件.html'
          $readme = Get-Content (Join-Path $s2m $readmeName) -Raw
          foreach ($required in @(
            '!Source2Metal_v3.0.10.exe',
            '!SyzygyCheck_v2.2.0.exe',
            'href="#en"',
            'href="#ru"',
            'href="#zh"',
            'MANUAL_EN.txt',
            'MANUAL_DE.txt',
            'MANUAL_NL.txt',
            'MANUAL_FR.txt',
            'MANUAL_ES.txt',
            'MANUAL_RU.txt',
            'MANUAL_ZH.txt',
            'Source2Metal_v3.0.10_RELEASE.zip',
            'Source code (zip)',
            'Source code (tar.gz)',
            'Ronald de Man',
            'Source code is deliberately not duplicated'
          )) {
            if (-not $readme.Contains($required)) { throw "HTML guide misses: $required" }
          }
          foreach ($obsolete in @(
            'README_Source2Metal_v3.0.10_7_LANGUAGES.html',
            '-extract-source',
            'SyzygyCheck_v2.2.0_FINAL_SOURCE.zip',
            '!SyzygyCheck_v2.0.9_V9F.exe',
            'Source2Metal_v3.0.9',
            'Source2Metal_v3.0.10_SOURCE.zip',
            ('Ronald de Man' + 's'),
            ('Ronald de Man' + [char]39 + 's')
          )) {
            $matches = Get-ChildItem $s2m -Recurse -File |
              Where-Object { $_.Extension -ne '.zip' } |
              Select-String -SimpleMatch $obsolete
            if ($matches) { throw "Current Source2Metal text contains obsolete reference: $obsolete" }
          }

          $manuals = @(Get-ChildItem $s2m -File -Filter 'MANUAL_*.txt')
          if ($manuals.Count -ne 7) {
            throw "Source2Metal must contain exactly seven current full manuals; found $($manuals.Count)"
          }
          foreach ($manual in $manuals) {
            $manualText = Get-Content $manual.FullName -Raw
            foreach ($required in @(
              'Source2Metal v3.0.10',
              '!Source2Metal_v3.0.10.exe',
              'SyzygyCheck v2.2.0',
              'SyzygyCheck_v2.2.0_UTILITY.zip',
              'Source2Metal_v3.0.10_RELEASE.zip',
              'Source code (zip)',
              'Source code (tar.gz)',
              'SHA256_Source2Metal_v3.0.10.txt'
            )) {
              if (-not $manualText.Contains($required)) {
                throw "$($manual.Name) misses current reference: $required"
              }
            }
          }

          $utility = Join-Path $s2m 'syzygycheck_package.zip'
          if ((Get-FileHash $utility -Algorithm SHA256).Hash.ToLowerInvariant() -ne
              'd80f8fd70f81b4f06cbd89547a7e346aa08688853b2ce2df25b30e93ccd6cb2c') {
            throw 'Embedded utility is not the published SyzygyCheck v2.2.0 release ZIP'
          }
          $utilityStage = Join-Path $env:RUNNER_TEMP 'SyzygyCheck_UTILITY_CHECK'
          if (Test-Path $utilityStage) { Remove-Item $utilityStage -Recurse -Force }
          Expand-Archive $utility $utilityStage
          foreach ($required in @(
            '!SyzygyCheck_v2.2.0.exe',
            '1_READ_FIRST_AL.txt',
            'Docs_AL/README_AL.txt',
            'Docs_AL/README_EN.txt',
            'Docs_AL/README_NL.txt',
            'Docs_AL/RELEASE_NOTES_v2.2.0.txt',
            'Docs_AL/RONALD_DE_MAN_NOTICE.txt',
            'Program_AL/SYZYGY_RECOVERY_EN.txt',
            'Program_AL/SYZYGY_HERSTEL_NL.txt',
            'Program_AL/SYZYGY_RECOVERY_RU.txt',
            'Program_AL/SYZYGY_RECOVERY_ZH.txt',
            'Program_AL/SYZYGY_RECUPERACION_ES.txt',
            'Program_AL/SYZYGY_RECUPERATION_FR.txt',
            'Program_AL/SYZYGY_WIEDERHERSTELLUNG_DE.txt'
          )) {
            if (-not (Test-Path (Join-Path $utilityStage $required))) {
              throw "SyzygyCheck utility misses: $required"
            }
          }
          $utilityNames = Get-ChildItem $utilityStage -Recurse -File |
            ForEach-Object { $_.FullName.Substring($utilityStage.Length + 1) }
          if ($utilityNames.Count -ne 22) {
            throw "SyzygyCheck utility must contain exactly 22 files; found $($utilityNames.Count)"
          }
          foreach ($obsolete in @('SOURCE.zip', 'REPO_FILES', 'MakeMem', 'VALIDATION_', '.go')) {
            if ($utilityNames -match [regex]::Escape($obsolete)) {
              throw "SyzygyCheck utility contains obsolete ballast: $obsolete"
            }
          }

      - name: Build Windows executable
        working-directory: source/Source2Metal_v3.0.10
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o '!Source2Metal_v3.0.10.exe' .

      - name: Run executable self-test and utility extraction test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.10'
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'Source2Metal_v3.0.10_RUNTIME'
          if (Test-Path $runtimeDir) { Remove-Item $runtimeDir -Recurse -Force }
          New-Item -ItemType Directory -Path $runtimeDir | Out-Null
          Copy-Item (Join-Path $sourceDir '!Source2Metal_v3.0.10.exe') $runtimeDir

          & (Join-Path $runtimeDir '!Source2Metal_v3.0.10.exe') -selftest
          if ($LASTEXITCODE -ne 0) { throw 'Source2Metal self-test failed' }

          & (Join-Path $runtimeDir '!Source2Metal_v3.0.10.exe') -extract-syzygy-package
          if ($LASTEXITCODE -ne 0) { throw 'SyzygyCheck utility extraction failed' }
          $expected = Join-Path $sourceDir 'syzygycheck_package.zip'
          $actual = Join-Path $runtimeDir 'SyzygyCheck_v2.2.0_UTILITY.zip'
          if ((Get-FileHash $expected -Algorithm SHA256).Hash -ne
              (Get-FileHash $actual -Algorithm SHA256).Hash) {
            throw 'Extracted SyzygyCheck utility differs from the embedded package'
          }

      - name: Prepare lean user release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release_v3.0.10'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.10'
          $exe = Join-Path $sourceDir '!Source2Metal_v3.0.10.exe'
          $readmeName = 'Readme-README-Прочтите-自述文件.html'
          $docsName = 'Docs-DOCUMENTATION-Документация-文档'
          $package = Join-Path $releaseDir 'Source2Metal_v3.0.10_RELEASE.zip'
          $hashFile = Join-Path $releaseDir 'SHA256_Source2Metal_v3.0.10.txt'

          if (Test-Path $releaseDir) { Remove-Item $releaseDir -Recurse -Force }
          New-Item -ItemType Directory -Path $releaseDir | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'Source2Metal_v3.0.10_PACKAGE'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $docs = Join-Path $stage $docsName
          New-Item -ItemType Directory -Path $docs | Out-Null

          Copy-Item $exe $stage
          Copy-Item (Join-Path $sourceDir $readmeName) $stage
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') (Join-Path $docs 'LICENSE_GPL-3.0.txt')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'PRIVACY.md') $docs
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'THIRD_PARTY_NOTICES.md') $docs
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'CODE_SIGNING_POLICY.md') $docs
          Copy-Item (Join-Path $sourceDir 'RELEASE_NOTES_v3.0.10.txt') $docs
          Copy-Item (Join-Path $sourceDir 'MANUAL_*.txt') $docs
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $package -CompressionLevel Optimal

          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $utility = Join-Path $sourceDir 'syzygycheck_package.zip'
          $utilityHash = (Get-FileHash $utility -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'Source2Metal v3.0.10 - SHA-256',
            '================================',
            '',
            "$packageHash  Source2Metal_v3.0.10_RELEASE.zip",
            "$exeHash  !Source2Metal_v3.0.10.exe",
            "$utilityHash  SyzygyCheck_v2.2.0_UTILITY.zip",
            '6e8d8429a55fbdb51e449a85829aa07d84b614fbe1894e1c7049428b4ba61b58  !SyzygyCheck_v2.2.0.exe'
          ) | Set-Content $hashFile -Encoding utf8NoBOM

          $publishedFiles = @(Get-ChildItem $releaseDir -File | Select-Object -ExpandProperty Name)
          $expectedPublishedFiles = @(
            'Source2Metal_v3.0.10_RELEASE.zip',
            'SHA256_Source2Metal_v3.0.10.txt'
          )
          if ((Compare-Object $publishedFiles $expectedPublishedFiles)) {
            throw 'Release directory must contain exactly the two manually published assets'
          }

          $check = Join-Path $env:RUNNER_TEMP 'Source2Metal_RELEASE_CHECK'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive $package $check
          $top = Get-ChildItem $check
          if ($top.Count -ne 3) { throw "User package must contain exactly three top-level items; found $($top.Count)" }
          foreach ($required in @(
            '!Source2Metal_v3.0.10.exe',
            $readmeName,
            $docsName,
            "$docsName/MANUAL_EN.txt",
            "$docsName/MANUAL_DE.txt",
            "$docsName/MANUAL_NL.txt",
            "$docsName/MANUAL_FR.txt",
            "$docsName/MANUAL_ES.txt",
            "$docsName/MANUAL_RU.txt",
            "$docsName/MANUAL_ZH.txt"
          )) {
            if (-not (Test-Path (Join-Path $check $required))) { throw "User package misses: $required" }
          }
          $allNames = Get-ChildItem $check -Recurse -File |
            ForEach-Object { $_.FullName.Substring($check.Length + 1) }
          foreach ($pattern in @('*SOURCE*.zip', 'Source2Metal_v3.0.10.exe', '*SyzygyCheck*.zip', '*MakeMem*', '*.go')) {
            $matches = $allNames | Where-Object { (Split-Path $_ -Leaf) -like $pattern }
            if ($matches) {
              throw "User package contains obsolete or wrongly named item matching: $pattern"
            }
          }

      - name: Create or verify v3.0.10 tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $remoteTag = git ls-remote --tags origin refs/tags/v3.0.10
          if ($LASTEXITCODE -eq 0 -and $remoteTag) {
            $tagSha = ($remoteTag -split '\s+')[0]
            if ($tagSha -ne $env:GITHUB_SHA) {
              throw 'Tag v3.0.10 already points to another commit; refusing to rewrite a published version'
            }
          } else {
            git tag v3.0.10 $env:GITHUB_SHA
            git push origin refs/tags/v3.0.10
          }

      - name: Publish v3.0.10 as Latest
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release_v3.0.10'
          $notes = Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.10/RELEASE_NOTES_v3.0.10.txt'
          $package = Join-Path $releaseDir 'Source2Metal_v3.0.10_RELEASE.zip'
          $hashFile = Join-Path $releaseDir 'SHA256_Source2Metal_v3.0.10.txt'
          if (gh release view v3.0.10) {
            gh release delete-asset v3.0.10 'Source2Metal_v3.0.10_SOURCE.zip' --yes 2>$null
            gh release upload v3.0.10 $package $hashFile --clobber
            gh release edit v3.0.10 --title 'Source2Metal v3.0.10' `
              --notes-file $notes --latest --target main
          } else {
            gh release create v3.0.10 $package $hashFile `
              --verify-tag --title 'Source2Metal v3.0.10' --notes-file $notes --latest
          }

      - name: Upload verified build evidence
        uses: actions/upload-artifact@v4
        with:
          name: Source2Metal-v3.0.10-verified-lean-release
          path: release_v3.0.10/*
          if-no-files-found: error
