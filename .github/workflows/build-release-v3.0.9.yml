name: Build and release Source2Metal v3.0.9

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/Source2Metal_v3.0.9/**'
      - 'source/SyzygyCheck_v2.0.9_V9F/**'
      - 'README.md'
      - 'BUILDING.md'
      - 'LICENSE'
      - 'PRIVACY.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'CODE_SIGNING_POLICY.md'
      - '.github/workflows/build-release-v3.0.9.yml'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Test Source2Metal
        working-directory: source/Source2Metal_v3.0.9
        run: |
          go test ./...
          go vet ./...

      - name: Test SyzygyCheck
        working-directory: source/SyzygyCheck_v2.0.9_V9F
        run: |
          go test ./...
          go vet ./...

      - name: Check clean current source and documentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $obsoletePaths = @(
            'build_inputs',
            'source/Source2Metal_v3.0.7',
            'source/SyzygyCheck_v2.0.7',
            'source/Source2Metal_v3.0.9/DEVELOPMENT_HISTORY',
            'source/Source2Metal_v3.0.9/legacy_sources',
            'source/Source2Metal_v3.0.9/assets',
            'source/Source2Metal_v3.0.9/embedded_source.go',
            'source/Source2Metal_v3.0.9/embedded_syzygy_source.go',
            'source/Source2Metal_v3.0.9/syzygycheck_source.zip'
          )
          foreach ($path in $obsoletePaths) {
            if (Test-Path $path) { throw "Obsolete path remains: $path" }
          }

          $sourceVersions = Get-ChildItem 'source' -Directory | Select-Object -ExpandProperty Name
          $expectedSourceVersions = @('Source2Metal_v3.0.9', 'SyzygyCheck_v2.0.9_V9F')
          if ((Compare-Object $sourceVersions $expectedSourceVersions)) {
            throw "Source tree must contain only the two current version directories"
          }
          $archives = Get-ChildItem . -Recurse -File -Include '*.zip', '*.7z', '*.tar', '*.gz' |
            Where-Object { $_.FullName -notlike '*\.git\*' }
          if ($archives.Count -ne 1 -or $archives[0].FullName -ne
              (Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.9/syzygycheck_package.zip')) {
            throw "The current source tree may contain only the one nested SyzygyCheck utility archive"
          }
          if (Get-ChildItem . -Recurse -File -Filter '*.exe' |
              Where-Object { $_.FullName -notlike '*\.git\*' }) {
            throw "Compiled executables do not belong in the source tree"
          }

          $s2m = 'source/Source2Metal_v3.0.9'
          $readmeName = 'Readme-README-Прочтите-自述文件.html'
          $readme = Get-Content (Join-Path $s2m $readmeName) -Raw
          foreach ($required in @(
            '!Source2Metal_v3.0.9.exe',
            '!SyzygyCheck_v2.0.9_V9F.exe',
            'href="#en"',
            'href="#ru"',
            'href="#zh"',
            'Ronald de Man',
            'Source code is deliberately not duplicated'
          )) {
            if (-not $readme.Contains($required)) { throw "HTML guide misses: $required" }
          }
          foreach ($obsolete in @(
            'README_Source2Metal_v3.0.9_7_LANGUAGES.html',
            'Source2Metal_v3.0.9_SOURCE.zip',
            '-extract-source',
            'SyzygyCheck_v2.0.9_V9F_FINAL_SOURCE.zip',
            ('Ronald de Man' + 's'),
            ('Ronald de Man' + [char]39 + 's')
          )) {
            $matches = Get-ChildItem $s2m -Recurse -File |
              Where-Object { $_.Extension -ne '.zip' } |
              Select-String -SimpleMatch $obsolete
            if ($matches) { throw "Current Source2Metal text contains obsolete reference: $obsolete" }
          }

          $utility = Join-Path $s2m 'syzygycheck_package.zip'
          $utilityStage = Join-Path $env:RUNNER_TEMP 'SyzygyCheck_UTILITY_CHECK'
          if (Test-Path $utilityStage) { Remove-Item $utilityStage -Recurse -Force }
          Expand-Archive $utility $utilityStage
          foreach ($required in @(
            '!SyzygyCheck_v2.0.9_V9F.exe',
            $readmeName,
            'Docs-DOCUMENTATION-Документация-文档/LICENSE_GPL-3.0.txt',
            'Docs-DOCUMENTATION-Документация-文档/SHA256_SyzygyCheck_v2.0.9_V9F.txt'
          )) {
            if (-not (Test-Path (Join-Path $utilityStage $required))) {
              throw "SyzygyCheck utility misses: $required"
            }
          }
          $utilityNames = Get-ChildItem $utilityStage -Recurse -File |
            ForEach-Object { $_.FullName.Substring($utilityStage.Length + 1) }
          if ($utilityNames.Count -ne 12) {
            throw "SyzygyCheck utility must contain exactly 12 files; found $($utilityNames.Count)"
          }
          foreach ($obsolete in @('SOURCE.zip', 'REPO_FILES', 'MakeMem', 'VALIDATION_', '.go')) {
            if ($utilityNames -match [regex]::Escape($obsolete)) {
              throw "SyzygyCheck utility contains obsolete ballast: $obsolete"
            }
          }

      - name: Build Windows executable
        working-directory: source/Source2Metal_v3.0.9
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o '!Source2Metal_v3.0.9.exe' .

      - name: Run executable self-test and utility extraction test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.9'
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'Source2Metal_v3.0.9_RUNTIME'
          if (Test-Path $runtimeDir) { Remove-Item $runtimeDir -Recurse -Force }
          New-Item -ItemType Directory -Path $runtimeDir | Out-Null
          Copy-Item (Join-Path $sourceDir '!Source2Metal_v3.0.9.exe') $runtimeDir

          & (Join-Path $runtimeDir '!Source2Metal_v3.0.9.exe') -selftest
          if ($LASTEXITCODE -ne 0) { throw 'Source2Metal self-test failed' }

          & (Join-Path $runtimeDir '!Source2Metal_v3.0.9.exe') -extract-syzygy-package
          if ($LASTEXITCODE -ne 0) { throw 'SyzygyCheck utility extraction failed' }
          $expected = Join-Path $sourceDir 'syzygycheck_package.zip'
          $actual = Join-Path $runtimeDir 'SyzygyCheck_v2.0.9_V9F_UTILITY.zip'
          if ((Get-FileHash $expected -Algorithm SHA256).Hash -ne
              (Get-FileHash $actual -Algorithm SHA256).Hash) {
            throw 'Extracted SyzygyCheck utility differs from the embedded package'
          }

      - name: Prepare lean user release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release_v3.0.9'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.9'
          $exe = Join-Path $sourceDir '!Source2Metal_v3.0.9.exe'
          $readmeName = 'Readme-README-Прочтите-自述文件.html'
          $docsName = 'Docs-DOCUMENTATION-Документация-文档'
          $package = Join-Path $releaseDir 'Source2Metal_v3.0.9_RELEASE.zip'
          $hashFile = Join-Path $releaseDir 'SHA256_Source2Metal_v3.0.9.txt'

          if (Test-Path $releaseDir) { Remove-Item $releaseDir -Recurse -Force }
          New-Item -ItemType Directory -Path $releaseDir | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'Source2Metal_v3.0.9_PACKAGE'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $docs = Join-Path $stage $docsName
          New-Item -ItemType Directory -Path $docs | Out-Null

          Copy-Item $exe $stage
          Copy-Item (Join-Path $sourceDir $readmeName) $stage
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'LICENSE') (Join-Path $docs 'LICENSE_GPL-3.0.txt')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'PRIVACY.md') $docs
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'THIRD_PARTY_NOTICES.md') $docs
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'CODE_SIGNING_POLICY.md') $docs
          Copy-Item (Join-Path $sourceDir 'RELEASE_NOTES_v3.0.9.txt') $docs
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $package -CompressionLevel Optimal

          $packageHash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $utility = Join-Path $sourceDir 'syzygycheck_package.zip'
          $utilityHash = (Get-FileHash $utility -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'Source2Metal v3.0.9 - SHA-256',
            '================================',
            '',
            "$packageHash  Source2Metal_v3.0.9_RELEASE.zip",
            "$exeHash  !Source2Metal_v3.0.9.exe",
            "$utilityHash  SyzygyCheck_v2.0.9_V9F_UTILITY.zip",
            'b384f37f5c67df5ac1e02ab55190e85a8034fd530d2be6a6d0c2fce5ea391c35  !SyzygyCheck_v2.0.9_V9F.exe'
          ) | Set-Content $hashFile -Encoding utf8NoBOM

          $check = Join-Path $env:RUNNER_TEMP 'Source2Metal_RELEASE_CHECK'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive $package $check
          $top = Get-ChildItem $check
          if ($top.Count -ne 3) { throw "User package must contain exactly three top-level items; found $($top.Count)" }
          foreach ($required in @(
            '!Source2Metal_v3.0.9.exe',
            $readmeName,
            $docsName
          )) {
            if (-not (Test-Path (Join-Path $check $required))) { throw "User package misses: $required" }
          }
          $allNames = Get-ChildItem $check -Recurse -File |
            ForEach-Object { $_.FullName.Substring($check.Length + 1) }
          foreach ($pattern in @('*SOURCE*.zip', 'Source2Metal_v3.0.9.exe', '*SyzygyCheck*.zip', '*MakeMem*', '*.go')) {
            $matches = $allNames | Where-Object { (Split-Path $_ -Leaf) -like $pattern }
            if ($matches) {
              throw "User package contains obsolete or wrongly named item matching: $pattern"
            }
          }

      - name: Refresh v3.0.9 tag to the corrected clean source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v3.0.9 $env:GITHUB_SHA
          git push origin refs/tags/v3.0.9 --force

      - name: Publish refreshed v3.0.9 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'release_v3.0.9'
          $notes = Join-Path $env:GITHUB_WORKSPACE 'source/Source2Metal_v3.0.9/RELEASE_NOTES_v3.0.9.txt'
          $package = Join-Path $releaseDir 'Source2Metal_v3.0.9_RELEASE.zip'
          $hashFile = Join-Path $releaseDir 'SHA256_Source2Metal_v3.0.9.txt'
          gh release upload v3.0.9 $package $hashFile --clobber
          gh release edit v3.0.9 --title 'Source2Metal v3.0.9' --notes-file $notes --latest --target main

      - name: Upload verified build evidence
        uses: actions/upload-artifact@v4
        with:
          name: Source2Metal-v3.0.9-verified-lean-release
          path: release_v3.0.9/*
          if-no-files-found: error
