name: Verify and publish Source2Metal v3.2.1 revision 2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/Source2Metal_v3.2.1/**'
      - 'source/Source2Metal_console/**'
      - 'validation/**'
      - 'tools/**'
      - '*.md'
      - '.github/workflows/build-release-v3.2.1.yml'
permissions:
  contents: write
concurrency:
  group: source2metal-3.2.1-r2
  cancel-in-progress: true
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify unchanged SyzygyCheck package
        working-directory: source/Source2Metal_v3.2.1
        shell: pwsh
        run: ./prepare_syzygy_package.ps1
      - name: Build recovered core from complete source
        working-directory: source/Source2Metal_v3.2.1
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Core vet failed' }
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o '../Source2Metal_console/core.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }
      - name: Verify and build approved console
        working-directory: source/Source2Metal_console
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Console tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Console vet failed' }
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o '../Source2Metal_v3.2.1/!Source2Metal_v3.2.1.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Console build failed' }
          & '../Source2Metal_v3.2.1/!Source2Metal_v3.2.1.exe' -selftest -no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Packaged selftest failed' }
      - name: Compare approved kernel and run Windows regressions
        run: python tools/verify_recovered_core.py
      - name: Package and validate documentation
        run: python tools/package_release.py
      - name: Test unpacked release in seven languages
        run: python tools/smoke_release.py release_v3.2.1/Source2Metal_v3.2.1_RELEASE.zip
      - name: Publish revision 2 after every check passes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Source2Metal-v3.2.1-r2-validation
          path: |
            release_v3.2.1/*
            validation/core_comparison.json
          if-no-files-found: warn
