name: Patch Source2Metal v3.2.2 graceful batch stop

on:
  push:
    branches:
      - feature/bin-progress-eta-v3.2.2
    paths:
      - '.github/workflows/patch-v3.2.2-stop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bin-progress-eta-v3.2.2
      - name: Patch graceful user stop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('source/Source2Metal_v3.2.2/main.go')
          text = p.read_text(encoding='utf-8')
          old = '''\t\tbinPaths, binErr := buildBINRaw(inv, layout, cfg, &c)\n\t\tif binErr != nil {\n\t\t\tc.Elapsed = time.Since(started)\n\t\t\t_ = writeReports(layout, inv, cfg, hw, c, "MISLUKT")\n\t\t\treturn binErr\n\t\t}\n'''
          new = '''\t\tbinPaths, binErr := buildBINRaw(inv, layout, cfg, &c)\n\t\tif errors.Is(binErr, errBINBatchStopped) {\n\t\t\tc.Elapsed = time.Since(started)\n\t\t\tpruneEmptyOutputDirs(layout)\n\t\t\t_ = writeReports(layout, inv, cfg, hw, c, "AFGEBROKEN")\n\t\t\tfmt.Println("\\n" + L(\n\t\t\t\t"Batch stopped by user.",\n\t\t\t\t"Batch vom Benutzer gestoppt.",\n\t\t\t\t"Batch door gebruiker gestopt.",\n\t\t\t\t"Lot arrêté par l’utilisateur.",\n\t\t\t\t"Lote detenido por el usuario.",\n\t\t\t\t"批处理已由用户停止。",\n\t\t\t\t"Пакет остановлен пользователем."))\n\t\t\treturn nil\n\t\t}\n\t\tif binErr != nil {\n\t\t\tc.Elapsed = time.Since(started)\n\t\t\t_ = writeReports(layout, inv, cfg, hw, c, "MISLUKT")\n\t\t\treturn binErr\n\t\t}\n'''
          if old not in text:
              raise SystemExit('target block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/Source2Metal_v3.2.2/main.go
          git diff --cached --quiet && exit 0
          git commit -m 'Treat user batch stop as graceful abort'
          git push origin HEAD:feature/bin-progress-eta-v3.2.2
