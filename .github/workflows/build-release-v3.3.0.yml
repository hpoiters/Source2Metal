name: Verify and publish Source2Metal v3.3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/Source2Metal_v3.3.0/**'
      - 'source/Source2Metal_console/**'
      - 'validation/ctg_v3.3.0/**'
      - 'tools/**'
      - '*.md'
      - '.github/workflows/build-release-v3.3.0.yml'

permissions:
  contents: write

concurrency:
  group: source2metal-3.3.0
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and verify unchanged SyzygyCheck package
        working-directory: source/Source2Metal_v3.3.0
        shell: pwsh
        run: ./prepare_syzygy_package.ps1

      - name: Test, vet and build core
        working-directory: source/Source2Metal_v3.3.0
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Core vet failed' }
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o '../Source2Metal_console/core.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Core build failed' }

      - name: Test, vet and build launcher
        working-directory: source/Source2Metal_console
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Console tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Console vet failed' }
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o '../Source2Metal_v3.3.0/!Source2Metal_v3.3.0.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Console build failed' }
          & '../Source2Metal_v3.3.0/!Source2Metal_v3.3.0.exe' -selftest -no-pause
          if ($LASTEXITCODE -ne 0) { throw 'Packaged selftest failed' }

      - name: Package and validate documentation
        run: python tools/package_release.py

      - name: Test unpacked release in seven languages
        run: python tools/smoke_release.py release_v3.3.0/Source2Metal_v3.3.0_RELEASE.zip

      - name: Publish v3.3.0 as Latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Source2Metal-v3.3.0-validation
          path: release_v3.3.0/*
          if-no-files-found: warn
